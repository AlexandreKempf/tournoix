
services:
  db:
    build:
      context: .
      dockerfile: PocketbaseDockerfile
    container_name: pocketbase
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./pocketbase:/pb/pb_data

  sveltekit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sveltekit_app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PUBLIC_POCKETBASE_URL: https://volley-api.alexku.be
    depends_on:
      - db

  newt:
    image: fosrl/newt
    container_name: newt
    restart: unless-stopped
    environment:
      - PANGOLIN_ENDPOINT=https://pangolin.alexku.be
      - NEWT_ID=XXX
      - NEWT_SECRET=XXX