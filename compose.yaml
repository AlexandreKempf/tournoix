
services:
  db:
    image: postgres:18
    container_name: sveltekit_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespostgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - ./postgres:/var/lib/postgresql

  sveltekit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sveltekit_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgrespostgres@db:5432/mydb
      NODE_ENV: production
    depends_on:
      - db